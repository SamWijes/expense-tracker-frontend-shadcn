name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend (Vite) to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          TS=$(date +%Y%m%d%H%M%S)
          APP_DIR="/var/www/expense-app"

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p $APP_DIR/releases/$TS"

          rsync -az --delete \
            dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$APP_DIR/releases/$TS/

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            sudo ln -sfn $APP_DIR/releases/$TS $APP_DIR/current
            sudo nginx -t
            sudo systemctl reload nginx
          EOF
